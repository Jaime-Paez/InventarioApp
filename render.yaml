services:
  - type: web
    name: inventarioapp-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrar_seguro && python manage.py collectstatic --noinput
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /ping/
    envVars:
      # Fija Python: si Render cambia su version por defecto, pandas/numpy
      # podian dejar de instalarse y el build fallaba sin cambios propios.
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: "inventarioapp-0mta.onrender.com,.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://kavajaimepaez.onrender.com,https://kava.peugeotjpaez.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://kavajaimepaez.onrender.com,https://kava.peugeotjpaez.com"
      - key: CORS_ALLOW_CREDENTIALS
        value: "1"
